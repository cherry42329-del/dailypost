duration_min_days: 4
duration_max_days: 7

budget_min_twd: 4000
budget_max_twd: 18000

direct_only: true
top_n: 3

# 每個目的地最多嘗試幾組出發/回程日期組合(優先窗口內的組合會排在前面優先被查)。
# 數字越大越完整,但 API 呼叫量與費用也越高。
max_date_combos_per_destination: 3

