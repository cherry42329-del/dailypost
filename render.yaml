services:
  - type: web
    name: dailypost-ig-autoreply
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: VERIFY_TOKEN
        sync: false
      - key: IG_BUSINESS_ACCOUNT_ID
        sync: false
      - key: PAGE_ACCESS_TOKEN
        sync: false
      - key: APP_SECRET
        sync: false
      - key: GRAPH_API_VERSION
        value: v21.0
      - key: COOLDOWN_MINUTES
        value: "10"
