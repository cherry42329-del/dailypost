<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>dailypost — IG 自動排程工具</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.4rem; }
  form { display: grid; gap: 0.75rem; margin-bottom: 2rem; padding: 1rem; border: 1px solid #8884; border-radius: 8px; }
  label { display: grid; gap: 0.25rem; font-size: 0.9rem; }
  input, textarea { font: inherit; padding: 0.5rem; border-radius: 6px; border: 1px solid #8886; }
  button { font: inherit; padding: 0.5rem 1rem; border-radius: 6px; border: none; background: #2563eb; color: #fff; cursor: pointer; }
  button.cancel { background: #dc2626; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #8883; font-size: 0.9rem; vertical-align: top; }
  .status { padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.75rem; color: #fff; }
  .status-pending { background: #d97706; }
  .status-publishing { background: #2563eb; }
  .status-published { background: #16a34a; }
  .status-failed { background: #dc2626; }
  #error { color: #dc2626; min-height: 1.2em; }
</style>
</head>
<body>
  <h1>dailypost — IG 自動排程工具</h1>

  <form id="post-form">
    <label>圖片網址 (imageUrl)
      <input type="url" name="imageUrl" placeholder="https://example.com/photo.jpg" required />
    </label>
    <label>文案 (caption)
      <textarea name="caption" rows="3" placeholder="貼文文字..."></textarea>
    </label>
    <label>發布時間 (本機時區)
      <input type="datetime-local" name="scheduledTime" required />
    </label>
    <div id="error"></div>
    <button type="submit">加入排程</button>
  </form>

  <table>
    <thead>
      <tr><th>發布時間</th><th>圖片</th><th>文案</th><th>狀態</th><th></th></tr>
    </thead>
    <tbody id="post-list"></tbody>
  </table>

  <script>
    const form = document.getElementById("post-form");
    const errorBox = document.getElementById("error");
    const list = document.getElementById("post-list");

    async function loadPosts() {
      const res = await fetch("/api/posts");
      const posts = await res.json();
      list.innerHTML = posts.map((post) => `
        <tr>
          <td>${new Date(post.scheduledTime + "Z").toLocaleString()}</td>
          <td><img src="${post.imageUrl}" alt="" style="width:60px;height:60px;object-fit:cover;border-radius:4px;" /></td>
          <td>${(post.caption || "").slice(0, 60)}</td>
          <td><span class="status status-${post.status}">${post.status}</span>${post.errorMessage ? `<div style="color:#dc2626;font-size:0.75rem;">${post.errorMessage}</div>` : ""}</td>
          <td>${post.status === "pending" || post.status === "failed" ? `<button class="cancel" data-id="${post.id}">取消</button>` : ""}</td>
        </tr>
      `).join("");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.textContent = "";
      const data = Object.fromEntries(new FormData(form));
      const res = await fetch("/api/posts", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      if (!res.ok) {
        const { error } = await res.json();
        errorBox.textContent = error || "新增失敗";
        return;
      }
      form.reset();
      loadPosts();
    });

    list.addEventListener("click", async (e) => {
      const id = e.target?.dataset?.id;
      if (!id) return;
      await fetch(`/api/posts/${id}`, { method: "DELETE" });
      loadPosts();
    });

    loadPosts();
    setInterval(loadPosts, 15000);
  </script>
</body>
</html>
